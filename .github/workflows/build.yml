name: Build SL Tasker Signed APK and Play AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode and Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ github.workspace }}/raw.p12"
            openssl pkcs12 -in "${{ github.workspace }}/raw.p12" -passin env:KEYSTORE_PASSWORD -nodes -out "${{ github.workspace }}/tmp.pem"
            openssl pkcs12 -export -in "${{ github.workspace }}/tmp.pem" -out "${{ github.workspace }}/release-keystore.p12" -name "$KEY_ALIAS" -passout env:KEYSTORE_PASSWORD -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f "${{ github.workspace }}/raw.p12" "${{ github.workspace }}/tmp.pem"
            keytool -list -storetype PKCS12 -keystore "${{ github.workspace }}/release-keystore.p12" -storepass "$KEYSTORE_PASSWORD"
          fi

      - name: Build Direct APK, Play AAB, and Play Test APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "$KEYSTORE_FILE" ]; then
            unset KEYSTORE_FILE
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDirectRelease bundlePlayRelease assemblePlayRelease --stacktrace
          else
            gradle assembleDirectRelease bundlePlayRelease assemblePlayRelease --stacktrace
          fi

      - name: Upload Direct Release APK (WhatsApp + Key)
        uses: actions/upload-artifact@v4
        with:
          name: sl-tasker-direct-release-apk
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - name: Upload Play Store Release AAB (Google Play Billing)
        uses: actions/upload-artifact@v4
        with:
          name: sl-tasker-play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload Play Flavor Test APK
        uses: actions/upload-artifact@v4
        with:
          name: sl-tasker-play-test-apk
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
